# 追蹤清單：代號 → 顯示名稱
watchlist:
  "0050": 元大台灣50
  "1904": 正隆
  "2009": 第一銅
  "2395": 研華
  "3008": 大立光
  "3034": 聯詠
  "5009": 榮剛
  "6517": 保勝光學

# 抓多少天歷史資料（算 MA60 / RSI 需要足夠長度）
lookback_days: 200

# 訊號規則參數
rules:
  rsi_overbought: 70
  rsi_oversold: 30
  volume_spike_ratio: 2.0        # 今日量 / 20 日均量
  inst_consecutive_days: 3       # 外資連續買/賣超天數
  new_high_window: 60            # 創 N 日新高 / 新低

# Dashboard 每檔顯示多少天 K 線
chart_days: 120

# 原物料（Yahoo Finance 代號）；related 是相關持股，會在晨報裡標示
commodities:
  - symbol: HG=F
    name: COMEX 銅
    unit: USD/lb
    related: ["2009"]

# 抓最近幾天的個股新聞
news_days: 2

# 新聞摘要使用的 Claude 模型（需設定 ANTHROPIC_API_KEY；沒設就只列標題）
llm_model: claude-haiku-5-5

# 每檔今日操作傾向（所有股票打包成一次呼叫）。判斷品質比摘要重要，預設用 Opus：
#   claude-opus-5-5   約每月 1 美元（$4 / $20 per MTok）
#   claude-sonnet-5-5 約每月 0.4 美元（$2 / $10 per MTok）
advisor_model: claude-opus-5-5


# 專家看法：每天用 Claude 網路搜尋各檔股票近期的券商／分析師觀點（需 ANTHROPIC_API_KEY）
# 每檔最多 4 次搜尋；ETF 略過；expert_days 是往回找幾天
expert_days: 30

# 盤前：昨夜美股（Yahoo Finance 代號）；related 是相關持股，會在晨報裡標示
# 台積電 ADR 會自動計算相對台股的溢價；美元/台幣與台指期夜盤會自動附上
overnight:
  - symbol: ^SOX
    name: 費城半導體
    related: ["3034", "3008", "6517", "2395"]
  - symbol: ^IXIC
    name: 那斯達克
    related: []
  - symbol: TSM
    name: 台積電 ADR
    related: ["0050"]
  - symbol: AAPL
    name: Apple
    related: ["3008"]
  - symbol: NVDA
    name: NVIDIA
    related: ["2395", "3008"]
